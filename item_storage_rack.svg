<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- 4-Tier Rack Frame (Steel Rods) -->
    <!-- Left Vertical Poles -->
    <line x1="100" y1="60" x2="100" y2="340" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="130" y1="75" x2="130" y2="345" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Right Vertical Poles -->
    <line x1="270" y1="75" x2="270" y2="345" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="60" x2="300" y2="340" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

    <!-- Tier 1 Shelf -->
    <rect x="95" y="100" width="210" height="14" rx="4" fill="#0284c7"/>
    <!-- Shoes on Tier 1 -->
    <ellipse cx="140" cy="92" rx="20" ry="8" fill="#38bdf8"/>
    <ellipse cx="185" cy="92" rx="20" ry="8" fill="#38bdf8"/>

    <!-- Tier 2 Shelf -->
    <rect x="95" y="160" width="210" height="14" rx="4" fill="#0284c7"/>
    <!-- Folded Clothes on Tier 2 -->
    <rect x="120" y="142" width="55" height="18" rx="3" fill="#f43f5e"/>
    <rect x="185" y="142" width="60" height="18" rx="3" fill="#10b981"/>

    <!-- Tier 3 Shelf -->
    <rect x="95" y="220" width="210" height="14" rx="4" fill="#0284c7"/>
    <!-- Books on Tier 3 -->
    <rect x="120" y="190" width="12" height="30" fill="#fbbf24"/>
    <rect x="134" y="195" width="12" height="25" fill="#a855f7"/>
    <rect x="148" y="188" width="14" height="32" fill="#ec4899"/>
    <rect x="164" y="192" width="12" height="28" fill="#3b82f6"/>

    <!-- Tier 4 Shelf -->
    <rect x="95" y="280" width="210" height="14" rx="4" fill="#0284c7"/>
    <!-- Organizers on Tier 4 -->
    <rect x="120" y="250" width="70" height="30" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="205" y="250" width="70" height="30" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  </g>

  <text x="200" y="375" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">4-TIER STORAGE RACK</text>
</svg>
