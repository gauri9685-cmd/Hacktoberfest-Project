<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="woodBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>

  <g transform="rotate(-35 200 200)" filter="url(#shadow)">
    <!-- Guitar Body -->
    <!-- Lower Bout -->
    <path d="M 160 210 C 130 230 110 270 110 310 C 110 360 150 380 200 380 C 250 380 290 360 290 310 C 290 270 270 230 240 210 C 265 190 275 160 265 130 C 255 100 225 90 200 90 C 175 90 145 100 135 130 C 125 160 135 190 160 210 Z" fill="url(#woodBurst)" stroke="#451a03" stroke-width="4"/>
    
    <!-- Sound Hole -->
    <circle cx="200" cy="180" r="28" fill="#18181b" stroke="#fef08a" stroke-width="3"/>
    <circle cx="200" cy="180" r="34" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Bridge -->
    <rect x="175" y="290" width="50" height="15" rx="3" fill="#292524"/>
    <rect x="180" y="293" width="40" height="3" fill="#f8fafc"/>
    
    <!-- Neck -->
    <rect x="190" y="-30" width="20" height="130" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    
    <!-- Frets -->
    <line x1="190" y1="-10" x2="210" y2="-10" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="190" y1="10" x2="210" y2="10" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="190" y1="30" x2="210" y2="30" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="190" y1="50" x2="210" y2="50" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="190" y1="70" x2="210" y2="70" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Headstock -->
    <polygon points="188,-30 212,-30 218,-80 182,-80" fill="#451a03"/>
    <!-- Tuning Pegs -->
    <circle cx="178" cy="-70" r="4" fill="#cbd5e1"/>
    <circle cx="178" cy="-55" r="4" fill="#cbd5e1"/>
    <circle cx="178" cy="-40" r="4" fill="#cbd5e1"/>
    <circle cx="222" cy="-70" r="4" fill="#cbd5e1"/>
    <circle cx="222" cy="-55" r="4" fill="#cbd5e1"/>
    <circle cx="222" cy="-40" r="4" fill="#cbd5e1"/>
    
    <!-- Strings -->
    <line x1="193" y1="-75" x2="193" y2="295" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
    <line x1="196" y1="-75" x2="196" y2="295" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
    <line x1="199" y1="-75" x2="199" y2="295" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
    <line x1="202" y1="-75" x2="202" y2="295" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
    <line x1="205" y1="-75" x2="205" y2="295" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
    <line x1="208" y1="-75" x2="208" y2="295" stroke="#f8fafc" stroke-width="0.8" opacity="0.8"/>
  </g>

  <text x="200" y="380" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle" letter-spacing="2">GIVSON ACOUSTIC GUITAR</text>
</svg>
