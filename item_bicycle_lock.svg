<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- Coiled Cable (3 Loops) -->
    <ellipse cx="200" cy="180" rx="90" ry="70" fill="none" stroke="#0284c7" stroke-width="22" stroke-dasharray="150, 10"/>
    <ellipse cx="200" cy="200" rx="95" ry="65" fill="none" stroke="#0369a1" stroke-width="20" opacity="0.85"/>
    <ellipse cx="200" cy="220" rx="90" ry="60" fill="none" stroke="#075985" stroke-width="18" opacity="0.7"/>

    <!-- Lock Body Hub -->
    <g transform="translate(200, 100)">
      <!-- Main Barrel -->
      <rect x="-45" y="-25" width="90" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
      
      <!-- Combination Dials (4 Numeric Rings) -->
      <rect x="-35" y="-18" width="14" height="36" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <text x="-28" y="5" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">5</text>

      <rect x="-17" y="-18" width="14" height="36" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <text x="-10" y="5" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">8</text>

      <rect x="3" y="-18" width="14" height="36" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <text x="10" y="5" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">2</text>

      <rect x="21" y="-18" width="14" height="36" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <text x="28" y="5" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">0</text>
    </g>
  </g>

  <text x="200" y="360" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">STEEL BICYCLE CABLE LOCK</text>
</svg>
