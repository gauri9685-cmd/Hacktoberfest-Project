<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fanBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <g filter="url(#shadow)">
    <!-- Base -->
    <ellipse cx="200" cy="330" rx="80" ry="25" fill="#334155" stroke="#475569" stroke-width="3"/>
    <!-- Speed Buttons on Base -->
    <circle cx="170" cy="330" r="6" fill="#ef4444"/>
    <circle cx="190" cy="330" r="6" fill="#f8fafc"/>
    <circle cx="210" cy="330" r="6" fill="#f8fafc"/>
    <circle cx="230" cy="330" r="6" fill="#f8fafc"/>
    
    <!-- Stand Neck -->
    <rect x="190" y="220" width="20" height="100" rx="5" fill="#64748b"/>
    
    <!-- Outer Grill Ring -->
    <circle cx="200" cy="150" r="95" fill="none" stroke="#94a3b8" stroke-width="6"/>
    <circle cx="200" cy="150" r="90" fill="#0f172a" fill-opacity="0.6"/>
    
    <!-- Grill Radial Spokes -->
    <g stroke="#64748b" stroke-width="1.5" opacity="0.6">
      <line x1="200" y1="55" x2="200" y2="245"/>
      <line x1="105" y1="150" x2="295" y2="150"/>
      <line x1="133" y1="83" x2="267" y2="217"/>
      <line x1="133" y1="217" x2="267" y2="83"/>
      <circle cx="200" cy="150" r="60" fill="none"/>
      <circle cx="200" cy="150" r="35" fill="none"/>
    </g>
    
    <!-- Fan Blades (3 Aerodynamic Blades) -->
    <g transform="translate(200, 150)">
      <!-- Blade 1 -->
      <path d="M 0 -15 C -25 -40 -35 -70 0 -80 C 30 -70 25 -40 0 -15 Z" fill="url(#fanBody)" opacity="0.9"/>
      <!-- Blade 2 -->
      <path d="M 0 -15 C -25 -40 -35 -70 0 -80 C 30 -70 25 -40 0 -15 Z" fill="url(#fanBody)" opacity="0.9" transform="rotate(120)"/>
      <!-- Blade 3 -->
      <path d="M 0 -15 C -25 -40 -35 -70 0 -80 C 30 -70 25 -40 0 -15 Z" fill="url(#fanBody)" opacity="0.9" transform="rotate(240)"/>
      <!-- Central Cap -->
      <circle cx="0" cy="0" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#f8fafc"/>
    </g>
  </g>

  <text x="200" y="380" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">BAJAJ MINOR DESK FAN</text>
</svg>
