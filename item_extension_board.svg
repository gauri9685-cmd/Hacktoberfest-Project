<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="strip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="switchOn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Cord -->
  <path d="M 40 200 Q 15 200 15 260 T 40 320 L 70 320" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
  <!-- Main Extension Strip -->
  <rect x="60" y="140" width="310" height="120" rx="20" fill="url(#strip)" filter="url(#shadow)"/>
  <!-- Master Switch -->
  <rect x="80" y="165" width="30" height="45" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="83" y="168" width="24" height="20" rx="2" fill="url(#switchOn)"/>
  <circle cx="95" cy="225" r="4" fill="#22c55e"/>
  <!-- 4 Sockets -->
  <!-- Socket 1 -->
  <g transform="translate(145, 200)">
    <circle cx="0" cy="0" r="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="0" cy="-12" r="4" fill="#334155"/>
    <circle cx="-10" cy="8" r="4.5" fill="#334155"/>
    <circle cx="10" cy="8" r="4.5" fill="#334155"/>
  </g>
  <!-- Socket 2 -->
  <g transform="translate(205, 200)">
    <circle cx="0" cy="0" r="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="0" cy="-12" r="4" fill="#334155"/>
    <circle cx="-10" cy="8" r="4.5" fill="#334155"/>
    <circle cx="10" cy="8" r="4.5" fill="#334155"/>
  </g>
  <!-- Socket 3 -->
  <g transform="translate(265, 200)">
    <circle cx="0" cy="0" r="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="0" cy="-12" r="4" fill="#334155"/>
    <circle cx="-10" cy="8" r="4.5" fill="#334155"/>
    <circle cx="10" cy="8" r="4.5" fill="#334155"/>
  </g>
  <!-- Socket 4 -->
  <g transform="translate(325, 200)">
    <circle cx="0" cy="0" r="26" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="0" cy="-12" r="4" fill="#334155"/>
    <circle cx="-10" cy="8" r="4.5" fill="#334155"/>
    <circle cx="10" cy="8" r="4.5" fill="#334155"/>
  </g>
  <!-- Brand text -->
  <text x="200" y="285" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="2">ANCHOR SURGE PROTECTOR</text>
</svg>
