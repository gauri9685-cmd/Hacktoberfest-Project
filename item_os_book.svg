<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(100, 40)">
    <!-- Book Spine 3D Effect -->
    <path d="M 0 0 L 15 -10 L 15 310 L 0 320 Z" fill="#1e40af"/>
    <!-- Book Pages Edge -->
    <path d="M 15 -10 L 195 -10 L 180 0 L 0 0 Z" fill="#f1f5f9"/>
    <!-- Main Book Cover -->
    <rect x="0" y="0" width="200" height="320" rx="4" fill="url(#bookCover)" stroke="#3b82f6" stroke-width="2"/>

    <!-- Silberschatz Dinosaur Silhouette Artwork -->
    <g transform="translate(40, 110) scale(0.6)" fill="#60a5fa" opacity="0.85">
      <path d="M 120 40 C 100 20 60 20 40 50 C 20 80 10 110 30 140 C 50 170 80 180 110 160 C 130 180 140 210 120 230 C 110 240 80 230 70 210 L 50 220 C 70 260 120 270 150 240 C 180 210 170 160 140 130 C 160 100 150 60 120 40 Z"/>
    </g>

    <!-- Book Title & Authors -->
    <text x="100" y="45" font-family="sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">OPERATING SYSTEM</text>
    <text x="100" y="65" font-family="sans-serif" font-size="15" font-weight="900" fill="#60a5fa" text-anchor="middle" letter-spacing="1">CONCEPTS</text>
    <text x="100" y="85" font-family="sans-serif" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="middle">NINTH EDITION</text>

    <!-- Authors footer -->
    <line x1="20" y1="260" x2="180" y2="260" stroke="#3b82f6" stroke-width="1"/>
    <text x="100" y="280" font-family="sans-serif" font-size="9" font-weight="500" fill="#e2e8f0" text-anchor="middle">Silberschatz • Galvin • Gagne</text>
    <text x="100" y="298" font-family="sans-serif" font-size="8" font-weight="bold" fill="#60a5fa" text-anchor="middle">WILEY</text>
  </g>
</svg>
