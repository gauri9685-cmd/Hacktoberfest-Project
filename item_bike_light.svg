<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lightBeam" cx="90%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Light Beam Radiating to Right -->
  <polygon points="260,195 380,120 380,270" fill="url(#lightBeam)"/>

  <g filter="url(#shadow)">
    <!-- Main Flashlight Housing -->
    <rect x="90" y="155" width="160" height="80" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="4"/>
    
    <!-- Lens Bezel -->
    <path d="M 240 155 L 260 165 L 260 225 L 240 235 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="260" cy="195" rx="6" ry="30" fill="#fef08a"/>
    
    <!-- Top Power Button -->
    <rect x="150" y="145" width="35" height="12" rx="4" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
    
    <!-- Side Grip Ridges -->
    <line x1="120" y1="170" x2="120" y2="220" stroke="#334155" stroke-width="3"/>
    <line x1="130" y1="170" x2="130" y2="220" stroke="#334155" stroke-width="3"/>
    <line x1="140" y1="170" x2="140" y2="220" stroke="#334155" stroke-width="3"/>

    <!-- Handlebar Mount Bracket -->
    <path d="M 150 235 L 150 280 A 25 25 0 0 0 190 280 L 190 235" fill="none" stroke="#475569" stroke-width="8"/>
    <circle cx="170" cy="285" r="5" fill="#f8fafc"/>
  </g>

  <text x="200" y="360" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">BIKE LED HEADLIGHT &amp; HORN</text>
</svg>
